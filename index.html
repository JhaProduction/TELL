function tab(x){["q","e","n"].forEach(k=>$("#p"+k).classList.toggle("on",k==x))}
const POL=`<h3>Privacy Policy &amp; Terms of Play</h3><p><small>Last updated: November 20, 2026</small></p>
<h3>1. About</h3><p>TELL is a free detective puzzle game. Contact: <b>suppport.jhaproduction@gmail.com</b>.</p>
<h3>2. What we store</h3><p>You do not need an account and we do not ask for personal information. Your nickname, progress, XP, settings and a few recent game seeds are saved only in your browser (local storage) on your own device, and we do not receive them. Use Settings, then Reset progress, or clear your browser data, to delete them.</p>
<h3>3. Children</h3><p>TELL is designed so children can play. It has no chat, no accounts, no purchases, and no violent or adult content. We do not knowingly collect personal information from children. Children under 13 (or the age required in your country) should play with a parent or guardian’s permission. Please do not use your real name as a nickname. Parents can contact us with any questions.</p>
<h3>4. Ads</h3><p>The game may show ads served by Google AdSense between rounds. Because children may play, ad requests are tagged for child-directed treatment, so ads are not personalized and the data used is limited. Google and its partners may still use cookies or device identifiers to deliver ads, limit how often they appear, measure them and prevent fraud. Learn more at <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener" style="color:#7a4a00">policies.google.com/technologies/ads</a>.</p>
<h3>5. Voiceover and sound</h3><p>Voiceover uses your browser’s built-in speech feature to read answers aloud. Music and sound effects are created inside the game. You can turn each off in Settings.</p>
<h3>6. Fair play</h3><p>Play for fun. Please do not try to damage, copy or resell the game. The game is provided “as is” without warranties.</p>
<h3>7. Changes</h3><p>We may update this policy. The date above will change and you may be asked to accept it again.</p>`;
function showAcc(){modal("<h3>Welcome to TELL</h3><p>Before you play, please read and accept our <b>Privacy Policy</b>. The game is suitable for all ages, has no accounts or chat, and keeps your progress only on this device. Ads may appear and are requested as child-directed (not personalized). Players under 13 should play with a parent or guardian’s permission.</p>",[["Read policy",()=>go("pol")],["Accept & play",()=>{P.acc=Date.now();save();if(P.pend)rr();else if(P.act){C=mk(P.act);showGame()}else toast("Welcome, detective!")}]])}
const HOW="<p>A suspect makes one <b>claim</b>. Ask questions (limited), then decide.</p><p>• Compare answers with the <b>Evidence Board</b> and with each other.<br>• <b>Truthful</b> (after 3 questions) clears them. A wrong call costs a life.<br>• <b>Accuse</b>: pick TWO items that truly conflict. Guessing fails: 3 wrong proofs lose the case.<br>• Tells (sweat, eyes) are hints only, never proof.<br>• 3 hints per shift, each costs 20 points.</p>";
function rh(){$("#hm").innerHTML=(P.act||P.pend?'<button class=btn onclick=cont()>Continue</button>':"")+`<button class=btn onclick="go('sh')">Campaign</button><button class=btn onclick=qk()>Quick Case</button><button class=btn ${P.unl>6?"":"disabled"} onclick=startOT()>Overtime ${P.unl>6?"":"🔒"}</button><button class="btn g" onclick="go('prof')">Profile</button><button class="btn g" onclick="go('how')">How to Play</button><button class="btn g" onclick="go('set')">Settings</button><button class="btn g" onclick="go('pol')">Privacy Policy</button>`}
function cont(){if(P.pend)return rr();if(P.act){C=mk(P.act);return showGame()}if(P.run)newCase()}
function qk(){modal("<h3>Quick Case</h3><p>Pick difficulty (half XP, no lives).</p>",[["Easy",()=>startQ(0)],["Medium",()=>startQ(1)],["Hard",()=>startQ(2)],["Cancel"]])}
function rs(){let h="";for(let s=1;s<=6;s++){const u=s<=P.unl,t=(P.stars[s]||[]).reduce((a,b)=>a+b,0);h+=`<div class=card><b>Levels ${s*5-4}–${s*5}</b> · ${DN[Math.min(2,(s*5-5)/10|0)]}+ · ${"★".repeat(Math.min(3,Math.round(t/5)))||"–"} <button class=btn ${u?"":"disabled"} onclick=startShift(${s})>${u?"Start":"🔒"}</button></div>`}$("#sl").innerHTML=h}
function rp(){const x=P.xp,i=rk(x),n=RK[i+1],pc=n?(x-RK[i][1])/(n[1]-RK[i][1])*100:100,s=P.st;$("#pf").innerHTML=`Nickname (not your real name) <input value="${esc(P.name)}" maxlength=16 onchange="P.name=this.value.slice(0,16);save()" style="padding:6px"><h3>${RK[i][0]} · ${x} XP</h3><div class=bar><i style="width:${pc}%"></i></div><p>Cases ${s.p} · Correct ${s.w}${s.p?" ("+Math.round(s.w/s.p*100)+"%)":""}<br>Liars caught ${s.c} · Truthful cleared ${s.k}<br>Best streak ${s.bs} · Best Overtime ${s.bo}</p>`}
function rset(){const b=(k,l)=>`<button class="btn g" onclick="tg('${k}')">${l}: ${P.set[k]?"ON":"OFF"}</button>`;$("#st").innerHTML=b("mus","Music")+b("sfx","Sound FX")+b("rm","Reduced motion")+b("vo","Voiceover")+`<button class="btn g" onclick="tg('tr')">Music: ${P.set.tr?"Noir groove":"Ambient hum"}</button>`+`<button class="btn g" onclick="go('pol')">Privacy policy</button><button class="btn g" onclick="P.tut=0;save();toast('Tutorial will replay')">Replay tutorial</button><button class="btn g" onclick="modal('<p>Erase ALL progress?</p>',[['Erase',()=>{const a=P.acc;P=DEF();P.acc=a;save();rset()}],['Cancel']])">Reset progress</button>`}
function tg(k){P.set[k]^=1;document.body.classList.toggle("rm",P.set.rm);save();if(k=="mus"||k=="tr")mus();rset()}
function startShift(s){P.run={mode:"c",s,i:0,cred:3,hints:3+P.bonus,res:[]};P.bonus=0;P.pend=null;newCase()}
function startQ(d){P.run={mode:"q",d,cred:9,hints:3};P.pend=null;newCase()}
function startOT(){P.run={mode:"o",cred:3,hints:3,n:0,sc:0};P.pend=null;newCase()}
function mk(a){let c;for(let i=0;i<50;i++){c=gen(a.seed,a.d,a.nT,a.fl);if(ok(c))return c;a.seed++}return c}
function newCase(){const r=P.run,m=r.mode,d=m=="q"?r.d:m=="o"?Math.min(2,r.n/3|0):Math.min(2,((r.s-1)*5+r.i)/10|0),nT=m=="c"?Math.min(TP.length,1+Math.ceil(r.s/2)):TP.length,L=P.last;let fl;if(L.length>2&&L.slice(-3).every(x=>x==L[L.length-1]))fl=!L[L.length-1];
let seed=Math.random()*1e9|0;while(P.seeds.includes(seed))seed++;P.act={seed,d,nT,fl,asked:[],wp:0,hu:0};C=mk(P.act);P.seeds=[...P.seeds,P.act.seed].slice(-30);save();showGame()}
const left=()=>BUD[P.act.d]-P.act.asked.length,txt=id=>id[0]=="e"||id=="rh"?C.ev.find(e=>e.id==id).text:C.ans[id];
function showGame(){tok++;busy=0;PM=0;sel=[];hl=[];go("game");tab("q");$("#proof").style.display="none";document.body.classList.toggle("rm",P.set.rm);
const a=P.act,last=a.asked[a.asked.length-1];$("#sus").innerHTML=`<div class=card><b>CLAIM</b><br>${C.claim}</div><div id=avw>${av(C.look,"neutral")}</div><div class=nm>${C.nm} · ${C.tr}</div><div class=bub id=bub>${last?esc(C.ans[last]):"Ask me anything, detective."}</div><div id=tl></div>`;
$("#pe").innerHTML="<h3>Evidence Board</h3>"+C.ev.map(e=>`<div class="card ev it" data-i="${e.id}">${e.text}</div>`).join("");rq();rn();rd();
if(!P.tut)tut(0)}
function rd(){const r=P.run,a=P.act;$("#hd").innerHTML=`<span>${r.mode=="c"?`Level ${(r.s-1)*5+r.i+1}/30 · ${DN[a.d]}`:r.mode=="o"?`Overtime · Case ${r.n+1}`:"Quick · "+DN[a.d]}</span><span>${r.mode=="q"?"":"Credibility "+"♥".repeat(r.cred)}</span><span>🔥${P.streak}</span><span>Hints ${r.hints}</span>`}
function rq(){const a=P.act;$("#pq").innerHTML=`<h3>Questions <span class=pips>${"●".repeat(left())+"○".repeat(BUD[a.d]-left())}</span></h3>`+C.qs.map(q=>{const u=a.asked.includes(q.id);return`<button class="btn g q ${u?"used":""} ${hl.includes(q.id)?"it hl":""}" data-q="${q.id}" ${u||busy||PM||left()<1?"disabled":""}><small>${q.cat}</small>${q.text}</button>`}).join("");
$("#bT").disabled=a.asked.length<3||busy||PM;$("#bA").disabled=busy||PM;$("#bH").disabled=busy||PM}
function rn(){const a=P.act;$("#pn").innerHTML="<h3>Notebook</h3>"+(a.asked.length?a.asked.map(id=>`<div class="card it line" data-i="${id}"><b>Q:</b> ${C.qs.find(q=>q.id==id).text}<br><b>A:</b> ${esc(C.ans[id])}</div>`).join(""):"<i>No answers yet.</i>");mark()}
function mark(){document.querySelectorAll(".it[data-i]").forEach(e=>{e.classList.toggle("sel",sel.includes(e.dataset.i));e.classList.toggle("hl",hl.includes(e.dataset.i))})}
function ask(id){const a=P.act;if(busy||PM||a.asked.includes(id)||left()<1)return;busy=1;hl=[];a.asked.push(id);save();SFX.paper();rq();rn();const t=C.tell[id],bub=$("#bub"),tk=tok;bub.textContent="…";$("#tl").textContent="";$("#avw").className="";
setTimeout(()=>{if(tk!=tok)return;const ans=C.ans[id];$("#avw").className="talk";say(ans);let i=0;const iv=setInterval(()=>{if(tk!=tok){clearInterval(iv);return}bub.textContent=ans.slice(0,++i);if(i%3==0)SFX.tick();if(i>=ans.length){clearInterval(iv);busy=0;$("#avw").innerHTML=av(C.look,t?"nervous":C.tr=="Smooth"&&C.lie?"smug":"neutral");$("#avw").className=t?"tl-"+t:"";if(t){$("#tl").textContent=TL[t];SFX.tell()}rq()}},22)},700+(t=="pa"?900:0)+Math.random()*400)}
function say(t){if(!P.set.vo||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),L=C.look,vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));u.lang="en-US";if(vs.length)u.voice=vs[(C.seed+L.h)%vs.length];u.pitch=[.8,1.3,.7,1.2,.9,1][L.k];u.rate=C.tr=="Nervous"?1.2:C.tr=="Calm"?.9:1;speechSynthesis.speak(u)}catch(e){}}
function hint(){const a=P.act,r=P.run;if(busy||PM)return;if(r.hints<1||a.hu>=3)return toast(a.hu>=3?"Max 3 hints per case":"No hints left");a.hu++;r.hints--;save();rd();hl=[];
if(a.hu==1){const q=C.qs.find(q=>!a.asked.includes(q.id)&&C.inv.includes(q.id))||C.qs.find(q=>!a.asked.includes(q.id));toast(q?`Hint: try the “${q.cat}” questions.`:"Hint: decide with what you have.")}
else if(a.hu==2){const x=C.con.find(x=>x.b[0]=="e");if(x){hl=[x.b];toast("Hint: check the highlighted evidence.")}else toast("Hint: the evidence looks consistent so far.")}
else{const x=C.con.find(x=>(a.asked.includes(x.a)||x.a[0]!="q")&&(a.asked.includes(x.b)||x.b[0]!="q")&&(x.a[0]=="q"||x.b[0]=="q")&&[x.a,x.b].filter(i=>i[0]=="q").every(i=>a.asked.includes(i)));if(x){hl=[x.a,x.b];toast("Hint: these two items conflict.")}else toast("No conflict found yet.")}mark();rq()}
function truth(){if(P.act.asked.length<3)return toast("Ask at least 3 questions first");modal("<p>Call this suspect <b>truthful</b>? A wrong call costs a life.</p>",[["Yes, truthful",()=>fin(!C.lie,"call")],["Not yet"]])}
function acc(){PM=1;sel=[];hl=[];$("#proof").style.display="flex";pr();document.querySelector(".game").classList.add("pm");rq()}
function pr(){const s=i=>sel[i]?esc(txt(sel[i])).slice(0,44)+"…":"—";$("#proof").innerHTML=`<div style="flex-basis:100%;text-align:center"><b>Pick TWO conflicting items</b> (evidence or notebook)<br>1: ${s(0)}<br>2: ${s(1)}</div><button class=btn onclick=sub()>Submit Proof</button><button class="btn g" onclick=canc()>Cancel</button>`;mark()}
function canc(){PM=0;sel=[];$("#proof").style.display="none";document.querySelector(".game").classList.remove("pm");mark();rq()}
function sub(){if(sel.length!=2)return toast("Select exactly two items");const[a,b]=sel;if(C.con.some(x=>(x.a==a&&x.b==b)||(x.a==b&&x.b==a))){SFX.chime();return fin(1,"proof")}bad(a=="rh"||b=="rh"?"Suspicious, but unrelated to the claim.":"That doesn’t contradict.")}
function bad(m){const a=P.act;a.wp++;save();SFX.buzz();toast(m+` (${a.wp}/3)`);sel=[];if(a.wp>=3)return setTimeout(()=>fin(0,"proof"),700);pr()}
function menu(){modal("<h3>Paused</h3>",[["Resume"],["How to Play",()=>modal(HOW,[["Close",menu]])],["Music "+(P.set.mus?"ON":"OFF"),()=>{tg("mus");menu()}],["SFX "+(P.set.sfx?"ON":"OFF"),()=>{tg("sfx");menu()}],["Voice "+(P.set.vo?"ON":"OFF"),()=>{tg("vo");menu()}],["Quit case",()=>{P.act=null;tok++;save();go("home")}]])}
function tut(i){const S=["1. Tap a <b>question</b>. Answers go to your Notebook.","2. Compare answers with the <b>Evidence Board</b>. Liars slip on details.","3. <b>Accuse</b> and pick the two items that conflict, or call <b>Truthful</b>.","4. Tells like sweat are hints, not proof. Good luck, detective!"];modal(`<p>${S[i]}</p>`,[[i<3?"Next":"Start",()=>i<3?tut(i+1):(P.tut=1,save())],["Skip",()=>{P.tut=1;save()}]])}
function fin(w,how){try{speechSynthesis.cancel()}catch(e){}const a=P.act,r=P.run,m=r.mode,dm=[1,1.5,2][a.d],bud=BUD[a.d],ob=RK.length&&rk(P.xp);let sc=0,b=[],raw=0;
if(w){const un=15*left(),ft=a.wp==0?20:0,hp=20*a.hu,sm=Math.min(1.5,1+.1*P.streak);raw=Math.max(0,(100+un+ft-hp)*(1-.1*a.wp));sc=Math.round(raw*dm*sm);b=[["Base",100],["Unused questions","+"+un],["First-try bonus","+"+ft],["Hints","-"+hp],["Wrong proofs","-"+a.wp*10+"%"],["Difficulty ×",dm],["Streak ×",sm.toFixed(1)]]}
const stars=!w?0:raw/(100+15*(bud-3)+20)>=.9?3:raw/(100+15*(bud-3)+20)>=.6?2:1,xp=Math.round(sc/5*(m=="q"?.5:1)),s=P.st;P.xp+=xp;s.p++;if(w){s.w++;C.lie?s.c++:s.k++;P.streak++;s.bs=Math.max(s.bs,P.streak)}else P.streak=0;P.last=[...P.last,C.lie].slice(-6);
const p={w,st:w?(C.lie?"LIAR CAUGHT":"CLEARED"):(how=="call"?"WRONG CALL":"CASE LOST"),ex:C.lie?C.con[0].exp:"Everything checked out. They told the truth.",b,sc,xp,s:stars,ru:rk(P.xp)>ob,nx:"next",d:a.d,rs:0,m};
if(m!="q"&&!w)r.cred--;
if(m=="c"){r.res.push(stars);if(r.cred<=0)p.nx="fail";else if(r.res.length>=5){p.nx="done";P.unl=Math.min(7,Math.max(P.unl,r.s+1));P.stars[r.s]=r.res}else r.i++;p.s5=r.s}
else if(m=="o"){r.n++;r.sc+=sc;if(r.cred<=0){p.nx="otend";s.bo=Math.max(s.bo,r.sc)}}else p.nx="qend";
p.sum=p.nx=="done"?`<p><b>Levels ${r.s*5-4}–${r.s*5} complete!</b> ${r.res.reduce((x,y)=>x+y,0)}/15 ★${r.s<6?" · Next shift unlocked.":" · Overtime unlocked!"}</p>`:p.nx=="fail"?"<p><b>Credibility gone. Shift failed.</b></p>":p.nx=="otend"?`<p><b>Overtime over.</b> Total score ${r.sc}</p>`:"";
P.pend=p;P.act=null;tok++;save();setTimeout(rr,w?300:700);SFX.stamp()}
function cu(id,n){const e=$(id),t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);e.textContent=Math.round(n*k);if(k<1)requestAnimationFrame(f)})(t0)}
function rr(){const p=P.pend,r=P.run;go("res");const bt=p.nx=="next"?'<button class=btn onclick=nxt()>Next case</button>':p.nx=="done"&&p.s5<6?`<button class=btn onclick="ad(()=>startShift(${p.s5+1}))">Next shift</button>`:p.nx=="fail"?`<button class=btn onclick="ad(()=>startShift(${r.s}))">Retry shift</button>`:p.nx=="otend"?'<button class=btn onclick="ad(startOT)">Overtime again</button>':p.nx=="qend"?`<button class=btn onclick="ad(()=>startQ(${p.d}))">Another case</button>`:"";
const i=rk(P.xp),n=RK[i+1],pc=n?(P.xp-RK[i][1])/(n[1]-RK[i][1])*100:100;
$("#res").innerHTML=`<div class=card style="text-align:center"><div class="stamp ${p.w?"ok":"no"}">${p.st}</div><p>${esc(p.ex)}</p><table>${p.b.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</table><h2>Score <span id=sc>0</span> · +<span id=xp>0</span> XP</h2><div class=stars>${"★".repeat(p.s)+"☆".repeat(3-p.s)}</div><div class=bar><i style="width:${pc}%"></i></div><small>${RK[i][0]} · ${P.xp} XP</small>${p.ru?`<p class="stamp ok" style="font-size:20px">Promoted: ${RK[i][0]}</p>`:""}${p.sum||""}<div class=row>${bt}${window.adBreak&&(p.nx=="done"||p.nx=="fail")?'<button class="btn g" onclick=rw()>Watch ad: +1 hint</button>':""}<button class="btn g" onclick="go('home')">Home</button></div></div>`;
cu("#sc",p.sc);cu("#xp",p.xp);if(p.w){SFX.chime();if(p.s==3){SFX.fan();for(let k=0;k<40;k++){const d=document.createElement("i");d.className="cf";d.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360} 80% 60%);animation-delay:${Math.random()*.5}s`;document.body.append(d);setTimeout(()=>d.remove(),3200)}}}}
function nxt(){P.pend=null;save();ad(()=>newCase())}
function ad(done){try{if(window.adBreak){adBreak({type:"next",name:"between-cases",adBreakDone:done});return}}catch(e){}let n=5;modal('<h3>Ad break</h3><div style="background:#0003;padding:30px;text-align:center;border:2px dashed #886">Your ad appears here<br><b id=adc>5</b>s</div>',[]);const b=document.createElement("button");b.className="btn";b.disabled=1;b.textContent="Continue";b.onclick=()=>{$("#modal").style.display="none";done()};$("#mbb").append(b);const iv=setInterval(()=>{n--;$("#adc").textContent=n;if(n<=0){clearInterval(iv);b.disabled=0}},1e3)}
function rw(){try{adBreak({type:"reward",name:"extra-hint",beforeReward:s=>s(),adViewed:()=>{P.bonus++;save();toast("+1 hint next shift")},adBreakDone:()=>{}})}catch(e){}}
document.addEventListener("click",e=>{const q=e.target.closest("[data-q]");if(q&&!q.disabled)return ask(q.dataset.q);const it=e.target.closest(".it[data-i]");if(it&&PM){const id=it.dataset.i;if(sel.includes(id))sel=sel.filter(x=>x!=id);else if(sel.length<2)sel.push(id);else return toast("Deselect one first");SFX.click();pr()}});
document.body.classList.toggle("rm",P.set.rm);rh();if(!P.acc)showAcc();else if(P.pend)rr();else if(P.act){C=mk(P.act);showGame()}
</script></body></html>
